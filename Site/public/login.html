<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Além da Camisa | Login</title>

    <script src="./js/sessao.js"></script>
    
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/icon/favicon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

</head>
<body>

<header class="navbar">
    <div class="logo">
        <img src="assets/imgs/logo.png" alt="Logo">

        <a href="index.html" class="logo_text">
            <h4>Além da Camisa</h4>
        </a>
    </div>

        <nav>
            <a href="login.html" class="btn_login">Login</a>
            <a href="cadastro.html" class="btn_cadastrar">Cadastrar</a>

        </nav>
</header>


<section class="container">
    <div class="card">
        
        <div class="icone">
                <img src="assets/imgs/iconelogin.png" alt="Icone Login">
        </div>
            <h4>Fazer Login</h4>

            <div class="formulario">
                <div class="campo">
                    <span>E-mail</span>
                    <input id="email_input" type="text" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <span>Senha</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>

                <button class="btn" onclick="entrar()">Entrar</button>

                
                <div id="cardErro" style="display:none; margin-top:10px;">
                    <span id="mensagem_erro" style="color:black;"></span>
                </div>

                <div class="cadastro_login_link">
                    <p>
                        Não tem uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                    </p>
                </div>

            </div>

        </div>

</section>


<footer class="footer">
        <p>© 2026 Camisas Históricas</p>
        <a href="sobrenos.html">Sobre Nós</a>
</footer>



</body>
<script>

function entrar() {

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {

        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos!";
        return false;
    }

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })

    .then(function (resposta) {

        if (resposta.ok) {

            resposta.json().then(json => {

                sessionStorage.EMAIL_USUARIO = json.email;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.ID_USUARIO = json.id;

                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "Login realizado com sucesso!";

                setTimeout(() => {
                    window.location = "./precificador.html";
                }, 2000);

            });

        } else {

            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "E-mail ou senha inválidos!";
            throw "Erro ao realizar login";
        }
    })

    .catch(function (erro) {
        console.log(erro);

        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Erro ao tentar fazer login!";
    });

    return false;
}

</script>
</html>
