<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Além da Camisa | Cadastro</title>

    <script src="./js/sessao.js"></script>
    
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" href="./assets/icon/favicon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

</head>
<body>
    
<header class="navbar">
    <div class="logo">
        <img src="assets/imgs/logo.png" alt="Logo">

        <a href="index.html" class="logo_text">
            <h4>Além da Camisa</h4>
        </a>
    </div>

        <nav>
            <a href="login.html" class="btn_login">Login</a>
            <a href="cadastro.html" class="btn_cadastrar">Cadastrar</a>

        </nav>
</header>


<section class="container">
    <div class="card">
        
        <div class="icone">
                <img src="assets/imgs/iconecadastro.png" alt="Icone Cadastro">
        </div>
            <h4>Criar Conta</h4>

            <div class="formulario">
                <div class="campo">
                    <span>Nome</span>
                    <input id="nome_input" type="text" placeholder="Seu Nome">
                </div>

                <div class="campo">
                    <span>E-mail</span>
                    <input id="email_input" type="email" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <span>Senha</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>

                <div class="campo">
                    <span>Confirmação da Senha:</span>
                    <input id="confirmacao_senha_input" type="password" placeholder="******" />
                </div>

                <button class="btn" onclick="cadastrar()">Cadastrar</button>

                <div id="cardErro" style="display:none; margin-top:10px;">
                    <span id="mensagem_erro" style="color:black;"></span>
                </div>

                <div class="cadastro_login_link">
                    <p>
                        Já tem uma conta?
                        <a href="login.html">Fazer Login</a>
                    </p>
                </div>

            </div>

        </div>

</section>



<footer class="footer">
        <p>© 2026 Camisas Históricas</p>
        <a href="sobrenos.html">Sobre Nós</a>
</footer>


    
</body>
<script>
function cadastrar() {

    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
        nomeVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == ""
    ) {

        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos!";
        return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {

        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "As senhas não coincidem!";
        return false;
    }

    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
        }),
    })

    .then(function (resposta) {

        if (resposta.ok) {

            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Cadastro realizado com sucesso!";

            setTimeout(() => {
                window.location = "login.html";
            }, 2000);

        } else {
            throw "Erro ao realizar cadastro";
        }
    })

    .catch(function (erro) {
        console.log(erro);
    });

    return false;
}

</script>
</html>
