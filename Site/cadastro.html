<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Além da Camisa | Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">

</head>
<body>
    
<header class="navbar">
    <div class="logo">
        <img src="logo.png" alt="Logo">
        <h4>Além da Camisa</h4>
    </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="precificador.html">Precificador</a>
            <a href="login.html" class="btn_login">Login</a>
            <a href="cadastro.html" class="btn_cadastrar">Cadastrar</a>

        </nav>
</header>


<section class="container">
    <div class="card">
        
        <div class="icone">
                <img src="iconecadastro.png" alt="Icone Cadastro">
        </div>
            <h4>Criar Conta</h4>

            <div class="formulario">
                <div class="campo">
                    <span>Nome</span>
                    <input id="nome_input" type="text" placeholder="Seu Nome">
                </div>

                <div class="campo">
                    <span>E-mail</span>
                    <input id="email_input" type="text" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <span>Senha</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>

                <div class="campo">
                    <span>Confirmação da Senha:</span>
                    <input id="confirmacao_senha_input" type="password" placeholder="******" />
                </div>

                <button class="btn" onclick="cadastrar()">Cadastrar</button>

                <div class="cadastro_login_link">
                    <p>
                        Já tem uma conta?
                        <a href="login.html">Fazer Login</a>
                    </p>
                </div>

            </div>

        </div>

</section>



<footer class="footer">
        <p>© 2026 Camisas Históricas</p>
        <a href="sobrenos.html">Sobre Nós</a>
</footer>


    
</body>
</html>
