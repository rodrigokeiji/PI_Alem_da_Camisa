<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Além da Camisa | Login</title>

    <script src="./js/sessao.js"></script>
    
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/icon/favicon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

</head>
<body>

<header class="navbar">
    <div class="logo">
        <img src="assets/imgs/logo.png" alt="Logo">
        <h4>Além da Camisa</h4>
    </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="precificador.html">Precificador</a>
            <a href="login.html" class="btn_login">Login</a>
            <a href="cadastro.html" class="btn_cadastrar">Cadastrar</a>

        </nav>
</header>


<section class="container">
    <div class="card">
        
        <div class="icone">
                <img src="assets/imgs/iconelogin.png" alt="Icone Login">
        </div>
            <h4>Fazer Login</h4>

            <div class="formulario">
                <div class="campo">
                    <span>E-mail</span>
                    <input id="email_input" type="text" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <span>Senha</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>

                <button class="btn" onclick="entrar()">Entrar</button>

                
                <div id="cardErro" style="display:none; margin-top:10px;">
                    <span id="mensagem_erro" style="color:red;"></span>
                </div>

                <div class="cadastro_login_link">
                    <p>
                        Não tem uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                    </p>
                </div>

            </div>

        </div>

</section>


<footer class="footer">
        <p>© 2026 Camisas Históricas</p>
        <a href="sobrenos.html">Sobre Nós</a>
</footer>



</body>
<script>

    function entrar() {

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
</html>
